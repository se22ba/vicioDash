services:
  - type: web
    name: vicio-club
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: ADMIN_KEY
        generateValue: true
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: WATCH_USER_IDS
        value: ""
