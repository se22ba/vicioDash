services:
  - type: web
    name: vicio-club
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    disk:
      name: vicio-historial
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_PATH
        value: /var/data/vicio.sqlite
      - key: ADMIN_KEY
        generateValue: true
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: WATCH_USER_IDS
        value: ""
