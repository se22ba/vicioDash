<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b71d30"><meta name="description" content="El club en números. Sesiones, juegos y participación de tu comunidad gamer."><title>VICIO — El club en números</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="rail"><a class="brand" href="#resumen" aria-label="Vicio, inicio"><img class="brand-mark" src="icon.svg" alt="Máscara de Deadpool"><span>VICIO<small>LA BANDA</small></span></a><div class="rail-label">EL GRUPO</div><nav aria-label="Principal"><button data-view="resumen" class="active"><span>▦</span>Resumen<i>01</i></button><button data-view="banda"><span>♧</span>La banda<i>02</i></button><button data-view="juegos"><span>⌘</span>Los juegos<i>03</i></button><button data-view="historial"><span>≡</span>Historial<i>04</i></button></nav><div class="rail-note"><img class="rail-mask" src="icon.svg" alt=""><p class="kb-note">Para que el KB<br>no mienta con sus<br>falsos registros.</p></div><button class="settings" data-view="ajustes"><span>⚙</span> Datos e integración ↗</button><div class="rail-footer">EST. 2026 <span>v1.0</span></div></aside>
<div class="workspace"><header class="topbar"><span class="breadcrumb">EL CLUB <span>/</span> <strong id="view-label">RESUMEN</strong></span><div class="top-actions"><span id="data-label" class="data-label">DISCORD</span></div></header>
<main><section class="squad-banner" aria-label="Actividad del grupo"><div class="banner-copy"><span class="issue-tag">VICIO / DISCORD</span><h2>¿ESTABAS<br><em>O TE BORRASTE?</em></h2><span class="banner-stamp">HISTORIAL DEL SERVIDOR</span></div><div class="hero-art"><img src="deadpool.png" alt="Deadpool sorprendido, con las manos en la cara"></div></section><div class="heading"><div><div class="eyebrow"><span class="tiny-cross">✳</span> ACTIVIDAD DEL GRUPO</div><h1 id="page-title">¿Quién es más tuts?</h1></div></div>
<div class="filterbar"><div class="periods" aria-label="Período"><button data-period="7">7 días</button><button data-period="14">2 semanas</button><button data-period="month" class="active">1 mes</button><button data-period="3m">3 meses</button><button data-period="6m">6 meses</button><button data-period="year">1 año</button><button data-period="custom">A medida ↗</button></div><div class="date-line" id="date-line"></div></div>
<div id="custom-range" class="custom-range" hidden><label>Desde <input type="date" id="range-start"></label><label>Hasta <input type="date" id="range-end"></label><button id="apply-range" class="secondary">Aplicar fechas</button></div>
<div class="subfilters"><label class="select-wrap"><span>JUGADOR</span><select id="player-filter"><option value="">Toda la banda</option></select></label><label class="select-wrap"><span>JUEGO</span><select id="game-filter"><option value="">Todos los juegos</option></select></label><label class="select-wrap"><span>ACTIVIDAD</span><select id="state-filter"><option value="">Todas las actividades</option></select></label><button class="text-button" id="more-filters" aria-expanded="false" aria-controls="advanced-filters">Más filtros ＋</button><button class="text-button" id="reset-filters">Restablecer ↺</button><span id="record-count"></span></div>
<div id="advanced-filters" class="advanced-filters" hidden><label>Presencia<select data-extra="status"><option value="">Cualquiera</option><option value="online">En línea</option><option value="idle">Ausente</option><option value="dnd">No molestar</option><option value="offline">Invisible / offline</option></select></label><label>Canal de voz<select data-extra="inVoice"><option value="">Cualquiera</option><option value="true">En voz</option><option value="false">Fuera de voz</option></select></label><label>Micrófono<select data-extra="muted"><option value="">Cualquiera</option><option value="true">Muteado</option><option value="false">Sin mute</option></select></label><label>Audio<select data-extra="deafened"><option value="">Cualquiera</option><option value="true">Ensordecido</option><option value="false">Sin sordera</option></select></label><label>Transmisión<select data-extra="streaming"><option value="">Cualquiera</option><option value="true">Transmitió</option><option value="false">No transmitió</option></select></label><label>Cámara<select data-extra="camera"><option value="">Cualquiera</option><option value="true">Encendida</option><option value="false">Apagada</option></select></label></div><div id="content" aria-live="polite"></div>
<footer class="page-footer"><span>VICIO</span></footer>
</main></div>
<dialog id="member-dialog"><form id="member-form"><div class="dialog-head"><h2 id="member-name">Integrante</h2><button type="button" class="close-dialog" aria-label="Cerrar">×</button></div><input type="hidden" name="id"><label class="roster-active"><input type="checkbox" name="active"> Incluir en asistencia</label><label id="member-token-row">Clave de administración<input type="password" id="member-token" autocomplete="off"></label><div id="member-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" class="secondary close-dialog">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form></dialog><dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title"></h2><button class="close-dialog" aria-label="Cerrar">×</button></div><div id="detail-content"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div><script type="module" src="app.js"></script>
</body></html>
